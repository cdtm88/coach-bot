[project]
name = "coach-bot"
version = "0.1.0"
description = "AI Cycling Coach, single-user Telegram coaching agent"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "anthropic>=0.69",
    "httpx>=0.27",
    # FIT-03 parses the original file rather than reading a derived aggregate,
    # so a FIT decoder is a runtime dependency and not a test convenience.
    "fitdecode>=0.10",
    # CALR-01 reads Google's secret iCal feeds, and CALR-03 depends on those
    # feeds being expanded correctly rather than approximately: a weekly
    # commitment is one VEVENT with an RRULE plus EXDATEs for the weeks it was
    # cancelled and RECURRENCE-ID overrides for the weeks it moved. Hand-rolling
    # that would miss the athlete's standing commitment, which is worse than
    # having no calendar at all.
    "icalendar>=6.0",
    "recurring-ical-events>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Writes the FIT files the ingest tests parse. Tests only: nothing in the
    # application ever writes one.
    "fit-tool>=0.9",
]

[project.scripts]
coach-migrate = "coach.migrate:main"
coach-seed = "coach.seed:main"
coach-ingest = "coach.ingest.server:main"
# The conversational process: Telegram long poll, one turn per backlog.
coach-agent = "coach.runtime.agent:main"
# The nightly process: decay, the fact export, and consolidation once a
# proposer is wired. See docs/state-of-build.md.
coach-scheduler = "coach.runtime.scheduler:main"
# OBS-13: read a model call back the way it happened. Not a process; the
# operator's way into the OBS-10 ledger.
coach-transcript = "coach.observe.transcript:main"
# TRUST-07's gate: replay the scanner over the OBS-10 payloads to find out
# whether it fires on the coach's real voice. Read-only, and the thing that has
# to say zero before COACH_TRUST_ENFORCE is worth setting.
coach-trust-audit = "coach.observe.trust_audit:main"
# A one-off for the matching defect fixed on 3 August 2026, and a console script
# rather than something under `scripts/` because the image does not ship that
# directory and the data lives in the deployment. Deletable once it has been run.
coach-reconcile = "coach.ingest.backfill:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
