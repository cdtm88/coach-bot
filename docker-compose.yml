# The homelab stack of docs/memory-design.md section 11.
#
# Five services. `postgres` holds the memory, `migrate` applies the schema and
# exits, and the three long-running processes are the ones `pyproject.toml`
# declares as console scripts. Bring it up with `docker compose up -d`; every
# process waits for the schema, so ordering is not yours to manage.
#
# Configuration is `.env` beside this file, read by compose itself rather than
# passed to the containers wholesale — each service is given the variables it
# reads and no others, so a leaked environment in one process is not a leaked
# environment in all three. `.env.example` is the canonical list and
# `docs/setup.md` section 4 says what each one gates.
#
# The two variables with no default are POSTGRES_PASSWORD and ANTHROPIC_API_KEY.
# Both use `:?` so a missing one fails at `up` with a message, rather than
# starting a coach that cannot answer.

# Docker's default json-file driver grows without limit. Three chatty services
# over months is a disk filler, and the disk it fills is the one holding the FIT
# archive — the one directory in the system that is never meant to be pruned
# (FIT-15). Capped here rather than left to the daemon's config so the bound
# travels with the stack.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build: .
  restart: unless-stopped
  logging: *logging
  # Every process reasons in the athlete's zone (TZ-01) and renders logs in the
  # container's. Unset, COACH_TZ falls back to UTC in code and nothing errors —
  # every day and week boundary is simply computed in the wrong zone. So it is
  # required here, loudly, rather than defaulted quietly.
  environment: &app-env
    DATABASE_URL: postgresql://coach:${POSTGRES_PASSWORD}@postgres:5432/coach
    COACH_TZ: ${COACH_TZ:?set COACH_TZ in .env, an IANA name like Asia/Dubai}
    TZ: ${TZ:-UTC}
    COACH_LOG_LEVEL: ${COACH_LOG_LEVEL:-INFO}
    # MODEL-02: model and reasoning effort per purpose, from the environment
    # rather than from code.
    #
    # Listed here because this file forwards nothing it does not name. There is
    # no `env_file:`, so `${VAR}` is only ever substituted into a value declared
    # in one of these blocks — putting MODEL_CHAT in .env and restarting changed
    # nothing at all, and looked exactly like a setting that had been applied.
    # The requirement said "configurable without a code change" and the code was
    # not the thing standing in the way.
    #
    # Empty is the same as unset to the router: it falls back to the default in
    # `coach.llm.router` rather than trying to route to "".
    #
    # In the shared anchor rather than per service because routing is decided
    # per purpose in code, and which process ends up calling which purpose is
    # not something a deployment file should be encoding a second opinion about.
    MODEL_CHAT: ${MODEL_CHAT:-}
    MODEL_CONSOLIDATION: ${MODEL_CONSOLIDATION:-}
    MODEL_SESSION_REVIEW: ${MODEL_SESSION_REVIEW:-}
    MODEL_TRANSCRIPTION: ${MODEL_TRANSCRIPTION:-}
    MODEL_RECALL_TEST: ${MODEL_RECALL_TEST:-}
    MODEL_REVIEW: ${MODEL_REVIEW:-}
    EFFORT_CHAT: ${EFFORT_CHAT:-}
    EFFORT_CONSOLIDATION: ${EFFORT_CONSOLIDATION:-}
    EFFORT_SESSION_REVIEW: ${EFFORT_SESSION_REVIEW:-}
    EFFORT_TRANSCRIPTION: ${EFFORT_TRANSCRIPTION:-}
    EFFORT_RECALL_TEST: ${EFFORT_RECALL_TEST:-}
    EFFORT_REVIEW: ${EFFORT_REVIEW:-}
  depends_on:
    postgres:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: coach
    volumes:
      - coach-db:/var/lib/postgresql/data
      - ./backups:/backups
    # SEC-05: no ports stanza. The database is reachable only from inside this
    # network, never from the host and never from the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    restart: "no"
    command: ["coach-migrate"]
    environment:
      DATABASE_URL: postgresql://coach:${POSTGRES_PASSWORD}@postgres:5432/coach
      TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy

  # The conversation. Telegram long poll in, one reply per backlog out.
  agent:
    <<: *app
    command: ["coach-agent"]
    environment:
      <<: *app-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      # SEC-03: the allowlist is checked on every message, so an empty value
      # would refuse the athlete rather than admit everyone. Still required,
      # because a bot that refuses its only user is a silent outage.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:?set TELEGRAM_ALLOWED_CHAT_ID in .env}
      DAILY_SPEND_CAP_USD: ${DAILY_SPEND_CAP_USD:-3.00}
      PERSONA_PATH: ${PERSONA_PATH:-/app/prompts/persona.md}
    volumes:
      # CHAT-02: the persona is a file so the coach's voice can change without a
      # deploy. Mounted read-only from the checkout for exactly that reason —
      # baked into the image it would need a rebuild to edit.
      - ./prompts:/app/prompts:ro
    # No ports. It reaches Telegram outbound; nothing reaches it.

  # The nightly work on the athlete's local 03:00 — consolidation, the sweep,
  # decay, the fact export — and P10's three timed messages, which are the
  # reason this service holds Telegram credentials.
  scheduler:
    <<: *app
    command: ["coach-scheduler"]
    environment:
      <<: *app-env
      # Consolidation calls the model once a night, on the heavier tier.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      DAILY_SPEND_CAP_USD: ${DAILY_SPEND_CAP_USD:-3.00}
      COACH_EXPORT_DIR: /backups
      # PLAN-05's sweep needs the calendar. Absent, the sweep is skipped with a
      # warning and the rest of the night still runs.
      INTERVALS_API_KEY: ${INTERVALS_API_KEY:?set INTERVALS_API_KEY in .env}
      INTERVALS_ATHLETE_ID: ${INTERVALS_ATHLETE_ID:-0}
      # P10: this process now speaks. The morning message, the evening
      # follow-up and the Sunday review are all sent from here, so it needs the
      # same Telegram credentials the agent has. Without them it logs
      # "P10 notifications not scheduled" and does everything else — which is
      # the intended failure, and quiet enough to miss for a week.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:?set TELEGRAM_ALLOWED_CHAT_ID in .env}
    volumes:
      # MEM-12's markdown export lands beside the pg_dump, in the same folder
      # postgres mounts. Read-write: this service is the one that writes it.
      - ./backups:/backups

  # Every inbound feed: two HTTP routes plus five polling loops in one process.
  ingest:
    <<: *app
    command: ["coach-ingest"]
    environment:
      <<: *app-env
      INTERVALS_API_KEY: ${INTERVALS_API_KEY:?set INTERVALS_API_KEY in .env}
      INTERVALS_ATHLETE_ID: ${INTERVALS_ATHLETE_ID:-0}
      # Unset means every webhook payload is refused, which is the correct
      # posture while no app is registered. Not required for that reason.
      INTERVALS_WEBHOOK_SECRET: ${INTERVALS_WEBHOOK_SECRET:-}
      # Unset means every macro payload is refused. Required: MacroLog posting
      # into a route that silently accepted anything would be worse.
      MACRO_INGEST_SECRET: ${MACRO_INGEST_SECRET:?set MACRO_INGEST_SECRET in .env}
      # CALR-01: comma separated secret iCal addresses. Bearer secrets — they
      # live in .env and reach no database and no log line.
      CALENDAR_ICS_URLS: ${CALENDAR_ICS_URLS:-}
      COACH_INGEST_PORT: "8080"
      # 0.0.0.0 inside the container, and this is required rather than relaxed.
      # `cloudflared` is a separate container with its own network namespace, so
      # binding to the coach's loopback would make the routes reachable by
      # nothing and MacroLog's posts would never arrive. What keeps this narrow
      # is the absence of a `ports:` stanza below: no published port means the
      # compose network and nowhere else.
      COACH_INGEST_HOST: "0.0.0.0"
      COACH_FIT_ARCHIVE: /var/fit-archive
      COACH_FIT_WATCH: /var/fit-inbox
      COACH_POLL_INTERVAL_S: ${COACH_POLL_INTERVAL_S:-120}
      COACH_SWEEP_INTERVAL_S: ${COACH_SWEEP_INTERVAL_S:-21600}
      COACH_WELLNESS_INTERVAL_S: ${COACH_WELLNESS_INTERVAL_S:-3600}
      COACH_CALENDAR_INTERVAL_S: ${COACH_CALENDAR_INTERVAL_S:-21600}
    volumes:
      # FIT-15: the archive is the permanent copy of every file the system has
      # seen and is never pruned — disconnecting an upstream integration deletes
      # that source's activities upstream, and this is what survives it. Put the
      # host path on storage you back up.
      - ${COACH_FIT_ARCHIVE:-./var/fit-archive}:/var/fit-archive
      # The drop folder. Anything ending in .fit that lands here is ingested with
      # no API call and no credential — the primary path for Zwift.
      - ${COACH_FIT_WATCH:-./var/fit-inbox}:/var/fit-inbox
    # Deliberately no ports stanza. The two routes are published by the tunnel
    # below, which reaches this service over the compose network. Publishing them
    # on the host as well would open a second door nothing needs.
    #
    # The only service with something to probe. `GET /health` answers without a
    # secret precisely so it can be used this way, and a wedged ingest process is
    # the failure most worth catching: it is six loops in one process, and the
    # athlete would notice a missing ride long before they noticed a stuck thread.
    # `agent` and `scheduler` have no route and no equivalent — a long poll that
    # has stopped looks identical to one that is waiting.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MEM-12's other half: the nightly pg_dump beside the markdown fact export.
  #
  # In the postgres image so `pg_dump` matches the server version — a newer
  # server dumped by an older client refuses outright. Not in the application,
  # because it needs the database credentials and a host destination that
  # `coach-scheduler` has no business holding.
  #
  # It dumps at 03:30, after the 03:00 consolidation. MEM-12 wants both artefacts
  # "dated after the most recent consolidation", so a dump at 02:00 would satisfy
  # the letter and miss the night's ratified facts.
  backup:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-UTC}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # The tunnel for the two inbound routes: MacroLog posts from the phone on
  # mobile data, and the intervals.icu webhook if an app is ever registered.
  # Nothing else is exposed and never the database.
  #
  # Opt-in, because it is the only service that makes anything reachable from
  # outside: `docker compose --profile tunnel up -d`. Without the profile the
  # stack runs complete and unreachable, which is the right default for a first
  # boot and for a machine where MacroLog is not yet configured.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # A named-tunnel token from the Cloudflare dashboard. It carries the
      # routing and the credentials, so no config file and no mounted cert.
      #
      # Defaulted rather than required, and that is not laziness: compose
      # interpolates every service's variables whatever profile is selected, so a
      # `:?` here would fail `docker compose up` on a machine with no Cloudflare
      # account — exactly the first boot the profile exists to let through.
      # Empty, cloudflared exits with its own clear message, and only when the
      # profile is actually enabled.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - ingest

volumes:
  coach-db:
