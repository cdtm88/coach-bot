name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # The suite runs against a real Postgres. The P00 invariants are database
      # invariants, so an in-memory substitute would test nothing that matters.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://coach:coach@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      # The runner's system Python is externally managed, so `uv pip install
      # --system` refuses to touch it. setup-python provides an interpreter that
      # is ours to install into.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

  # The suite cannot see this class of failure. Every test imports `coach` from
  # the checkout, so a Dockerfile that ships a virtualenv the package is not
  # actually installed into passes everything and then dies at container start
  # with `ModuleNotFoundError`. Found the hard way on a real deploy.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t coach-bot:ci .

      # Importing every entry point's module, rather than just `coach`, so a
      # dependency resolved for the dev extra but missing from the runtime venv
      # is caught here too.
      - name: The virtualenv is self-contained
        run: |
          docker run --rm coach-bot:ci python -c "
          import coach.migrate, coach.seed, coach.ingest.server
          import coach.runtime.agent, coach.runtime.scheduler
          import coach.observe.transcript"

      - name: Every entry point resolves
        run: |
          docker run --rm coach-bot:ci sh -c '
            for exe in coach-migrate coach-seed coach-ingest coach-agent coach-scheduler coach-transcript coach-reconcile; do
              command -v "$exe" >/dev/null || { echo "missing: $exe"; exit 1; }
            done'

      - name: The data the image is expected to carry is present
        run: |
          docker run --rm coach-bot:ci sh -c '
            test -f /app/prompts/persona.md &&
            test -f /app/seeds/athlete.json &&
            test "$(ls /app/migrations/*.sql | wc -l)" -ge 13'

      # Present on disk is not the same as reachable by the code that reads it.
      # `migrate` resolved its directory relative to the source tree, so in the
      # image it globbed an empty path, applied nothing, and reported "schema up
      # to date" against an empty database.
      - name: The code can actually find that data
        run: |
          docker run --rm coach-bot:ci python -c "
          from coach.migrate import discover
          from coach.agent.persona import load
          found = discover()
          assert len(found) >= 13, found
          assert load(), 'persona is empty'"

      - name: It does not run as root
        run: |
          test "$(docker run --rm coach-bot:ci id -u)" = 10001
